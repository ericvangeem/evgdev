<div>
  <div class="product-details">
    <div>
      <div>
        <h1>{{name}}</h1>
        <p class="product-meta">
          <span class="product-sku">SKU: {{sku}}</span>
          <span class="product-category">{{category}}</span>
          <span class="product-color">{{color}}</span>
        </p>
        <p class="product-price">{{price}} {{currency}}</p>
        <p class="product-rating">Rating: {{rating}} / 5</p>
        <p class="product-stock">{{stock_quantity}} in stock</p>
      </div>
    </div>
  </div>
</div>
